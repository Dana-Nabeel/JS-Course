<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lofty | register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="flex flex-col p-4 md:flex-row md:h-screen">
      <div class="p-6 pb-24 md:order-1 order-2 h-full w-full md:w-1/4 overflow-hidden rounded-2xl bg-[url(/images/register-bg.png)] bg-center bg-no-repeat bg-cover relative">
        <h2 class="text-xl font-bold mb-4">welcome to Lofty service</h2>
        <h4>You have 3 steps to register on the platform</h4>

        <div class="flex items-center gap-2 w-4/5 my-6">
          <div class="stage  w-1/3 p-1 rounded-full bg-[#214206]" data-step="0"></div>
          <div class="stage  w-1/3 p-1 rounded-full bg-[#214206] opacity-50" data-step="1"></div>
          <div class="stage  w-1/3 p-1 rounded-full bg-[#214206] opacity-50" data-step="2"></div>
        </div>
        <!-- stages -->
        <div class="stages grid gap-4">
          <div data-step="0" class="stage flex items-center gap-2">
            <svg width="42" height="42" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
              <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
              <g id="SVGRepo_iconCarrier">
                <path d="M4 9.00005L10.2 13.65C11.2667 14.45 12.7333 14.45 13.8 13.65L20 9" stroke="#000000" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M3 9.17681C3 8.45047 3.39378 7.78123 4.02871 7.42849L11.0287 3.5396C11.6328 3.20402 12.3672 3.20402 12.9713 3.5396L19.9713 7.42849C20.6062 7.78123 21 8.45047 21 9.17681V17C21 18.1046 20.1046 19 19 19H5C3.89543 19 3 18.1046 3 17V9.17681Z" stroke="#000000" stroke-width="1" stroke-linecap="round"></path>
              </g>
            </svg>
            <div>
              <h4 class="font-bold">Login</h4>
              <p class="text-gray-700">Enter your email</p>
            </div>
          </div>
          <div data-step="1" class="stage flex items-center gap-2 opacity-50">
            <svg width="42" height="42" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
              <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
              <g id="SVGRepo_iconCarrier">
                <path d="M4 9.00005L10.2 13.65C11.2667 14.45 12.7333 14.45 13.8 13.65L20 9" stroke="#000000" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M3 9.17681C3 8.45047 3.39378 7.78123 4.02871 7.42849L11.0287 3.5396C11.6328 3.20402 12.3672 3.20402 12.9713 3.5396L19.9713 7.42849C20.6062 7.78123 21 8.45047 21 9.17681V17C21 18.1046 20.1046 19 19 19H5C3.89543 19 3 18.1046 3 17V9.17681Z" stroke="#000000" stroke-width="1" stroke-linecap="round"></path>
              </g>
            </svg>
            <div>
              <h4 class="font-bold">Personal Information</h4>
              <p class="text-gray-700">Name, lineage, city...</p>
            </div>
          </div>
          <div data-step="2" class="stage flex items-center gap-2 opacity-50">
            <svg width="42" height="42" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
              <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
              <g id="SVGRepo_iconCarrier">
                <path d="M4 9.00005L10.2 13.65C11.2667 14.45 12.7333 14.45 13.8 13.65L20 9" stroke="#000000" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"></path>
                <path d="M3 9.17681C3 8.45047 3.39378 7.78123 4.02871 7.42849L11.0287 3.5396C11.6328 3.20402 12.3672 3.20402 12.9713 3.5396L19.9713 7.42849C20.6062 7.78123 21 8.45047 21 9.17681V17C21 18.1046 20.1046 19 19 19H5C3.89543 19 3 18.1046 3 17V9.17681Z" stroke="#000000" stroke-width="1" stroke-linecap="round"></path>
              </g>
            </svg>
            <div>
              <h4 class="font-bold">Your e-commerce details</h4>
              <p class="text-gray-700">Details about your trade</p>
            </div>
          </div>
        </div>
        <a href="index.html" class="flex items-center gap-2 absolute bottom-4"><i class="fa-solid fa-arrow-left-long"></i>Back to Login page</a>
      </div>
      <!-- form -->
      <div class="md:order-2 order-1 w-full md:w-2/3 flex items-center">
        <div class="form-wrapper w-full md:w-3/4 max-h-full overflow-auto mx-auto p-6">
          <form action="" method="post">
            <div class="multistep">
              <!-- logo -->
              <div class="flex justify-center items-center gap-6 mb-9">
                <img class="mx-auto" src="images/logo.svg" alt=""/>
              </div>
              <!-- sign toggle -->
              <div class="bg-gray-50 border border-gray-200 p-2 my-8 rounded-xl flex gap-2">
                <a href="" class="w-1/2 p-2 rounded-xl text-center hover:bg-gray-100 border border-gray-100/65">Login</a>
                <a href="#" class="w-1/2 p-2 rounded-xl text-center bg-[#D0ECA2]/60 hover:bg-[#D0ECA2] border border-[#D0ECA2]">Register</a>
              </div>
              <!-- step 1 -->
              <div data-step="0" class="step block">
                <div class="mb-3">
                  <label for="email">Email Address</label>
                  <input type="email" name="email" id="email" class="block w-full px-3 py-2 border border-gray-200 outline-0 rounded-lg required" placeholder="Enter your email address"/>
                </div>
                <div class="mb-3 password">
                  <label for="password">Password</label>
                  <input type="password" name="password" id="password" class="block w-full px-3 py-2 border border-gray-200 outline-0 rounded-lg required" placeholder="Enter your password"/>
                </div>
                <div class="mb-3 password">
                  <label for="passwordConfirm">Password confirmation</label>
                  <input type="password" name="passwordConfirm" id="passwordConfirm" class="block w-full px-3 py-2 border border-gray-200 outline-0 rounded-lg required" placeholder="Enter your password confirmation"/>
                </div>
                <button type="button" class="nxt-btn text-white rounded-full w-full p-3 mt-3 cursor-pointer bg-[#4E751A] hover:bg-[#70a121]">Next</button>
              </div>
              <!-- step 2 -->
              <div data-step="1" class="step hidden">
                <div class="grid md:grid-cols-2 gap-3">
                  <div class="mb-3">
                    <label for="first-name">First name *</label>
                    <input type="text" name="first-name" id="first-name" placeholder="Enter your first name" class="block w-full px-3 py-2 border border-gray-200 outline-0 rounded-lg required"/>
                  </div>
                  <div class="mb-3">
                    <label for="last-name">Last name *</label>
                    <input type="text" name="last-name" id="last-name" placeholder="Enter your last name" class="block w-full px-3 py-2 border border-gray-200 outline-0 rounded-lg required"/>
                  </div>
                </div>
                <div class="grid md:grid-cols-2 gap-3">
                  <div class="mb-3">
                    <label for="store-name">Business Name *</label>
                    <input type="text" name="store-name" id="store-name" placeholder="Enter your store name" class="block w-full px-3 py-2 border border-gray-200 outline-0 rounded-lg required"/>
                  </div>
                  <!-- country select menu -->
                  <div class="mb-3">
                    <label for="country">Country *</label>
                    <select id="country" name="country" class="block w-full px-3 py-2 border border-gray-200 outline-0 rounded-lg required">
                      <option value=""></option>
                      <option value="Saudi Arabia">Saudi Arabia</option>
                      <option value="United Arab Emirates">United Arab Emirates</option> 
                      <option value="Kuwait">Kuwait</option> 
                      <option value="Oman">Oman</option> <option value="Bahrain">Bahrain</option> 
                    </select>
                  </div>
                </div>
                <div class="grid md:grid-cols-2 gap-3">
                  <div class="mb-3">
                    <label for="city">City *</label>
                    <input type="text" name="city" id="city" placeholder="Enter your City" class="block w-full px-3 py-2 border border-gray-200 outline-0 rounded-lg required"/>
                  </div>
                  <div class="mb-3">
                    <label for="address">Address *</label>
                    <input type="text" name="address" id="address" placeholder="Enter your address" class="block w-full px-3 py-2 border border-gray-200 outline-0 rounded-lg required"/>
                  </div>
                </div>
                <small>* Required fields</small>

                <div class="flex justify-end items-center mt-4">
                  <div>
                    <button type="button" class="back-btn my-0 mx-2.5 text-gray-400 cursor-pointer hover:text-gray-500">Back</button>
                    <button type="button" class="nxt-btn text-white rounded-full px-4 py-2 cursor-pointer bg-[#284f07] hover:bg-[#70a121]">Next</button>
                  </div>
                </div>
              </div>
              <!-- step 3 -->
              <div data-step="2" class="step hidden">
                <div class="flex justify-end items-center mt-4">
                  <div>
                    <button type="button" class="back-btn my-0 mx-2.5 text-gray-400 cursor-pointer hover:text-gray-500">Back</button>
                    <button type="button" class="nxt-btn text-white rounded-full px-4 py-2 cursor-pointer bg-[#284f07] hover:bg-[#70a121]">Next</button>
                  </div>
                </div>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
    <script src="js/script.js"></script>
  </body>
</html>
