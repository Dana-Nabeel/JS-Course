<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css"/>
  </head>
  <body class="min-h-screen">
    <!-- contextMenu -->
    <div class="new-menu bg-gray-50 shadow rounded w-40 fixed hidden z-30">
      <ul class="gap-2">
        <li class="hover:bg-blue-100 cursor-pointer p-2 px-4">New</li>
        <li class="hover:bg-blue-100 cursor-pointer p-2 px-4">Copy</li>
        <li class="hover:bg-blue-100 cursor-pointer p-2 px-4">Cut</li>
        <li class="hover:bg-blue-100 cursor-pointer p-2 px-4">Paste</li>
        <li class="hover:bg-blue-100 cursor-pointer p-2 px-4">Delete</li>
        <li class="hover:bg-blue-100 cursor-pointer p-2 px-4">Undo</li>
        <li class="hover:bg-blue-100 cursor-pointer p-2 px-4">Redo</li>
      </ul>
    </div>
    <!-- Accordion -->
     <div class="wrapper rounded mx-auto my-6 w-[60%] shadow bg-amber-50">
     </div>

    <script src="js/jquery-3.7.1.min.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
