<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Quiz</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">
    <div class="start-quiz block text-center">
      <h1 class="text-4xl font-bold mb-6 text-blue-700">Welcome to the Quiz</h1>
      <div class="score text-xl font-semibold text-green-500 my-4"></div>
      <button class="start-btn px-8 py-3 bg-blue-600 text-white font-bold text-xl cursor-pointer rounded shadow hover:bg-blue-700 duration-200">Start Quiz</button>
    </div>

    <div class="quiz hidden w-full max-w-2xl">
      <!-- Timer -->
      <div id="timer" class="text-2xl font-bold text-red-600 mb-6 text-center">
        Time Left: <span> 2:00 </span>
      </div>
      <!-- quiz cards -->
      <div class="q-wrapper"></div>

      <div class="text-center">
        <button class="submit px-8 py-3 bg-green-600 text-white rounded-lg shadow  cursor-pointer hover:bg-green-700 duration-200">Submit quiz</button>
      </div>
    </div>

    <script src="js/script.js"></script>
  </body>
</html>
